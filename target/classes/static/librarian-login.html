<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Librarian Login | SmartLib</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #111827;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
    }

    .login-box {
      background: #1f2937;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      color: white;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #dc2626;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #b91c1c;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Librarian Access</h2>
    <p>Authorized personnel only</p>

    <form action="/librarian/login" method="post">
      <input type="email" name="email" placeholder="Official Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
