<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartLibrary Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .navbar {
            height: 60px;
            background-color: #1e293b;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        /* CENTER CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-center {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
        }

        .auth-center a {
            text-align: center;
            padding: 12px;
            text-decoration: none;
            color: white;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-register {
            background-color: #2563eb;
        }

        .btn-login {
            background-color: #16a34a;
        }

        .auth-center a:hover {
            opacity: 0.9;
        }

        /* FOOTER */
        .footer {
            height: 50px;
            background-color: #b8b9ae;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .staff-link {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="navbar">
   <center> <div class="logo">📚 SmartLib</div </center>
</header>

<!-- CENTER -->
<main class="main-content">
    <div class="auth-center">
        <a href="register.html" class="btn-register">Register</a>
        <a href="login.html" class="btn-login">Login</a>
    </div>
</main>

<!-- FOOTER -->
<footer class="footer">
    <a href="librarian-login.html" class="staff-link">Librarian Access</a>
</footer>

</body>
</html>
